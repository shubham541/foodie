<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" /> <!-- Link to CSS file -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            padding: 30px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            color: #ff6347;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input[type="email"], .form-group input[type="password"], .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .form-group input[type="submit"] {
            background-color: #ff6347;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }

        .form-group input[type="submit"]:hover {
            background-color: #ff7f50;
        }

        .toggle-link {
            text-align: center;
            margin-top: 10px;
        }

        .toggle-link a {
            color: #ff6347;
            text-decoration: none;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- Include the header (navigation bar) -->
<div th:replace="fragments/header :: div"></div>

<div class="form-container">
    <h2>Login</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="login-role">Login as:</label>
            <select id="login-role" name="role" required>
                <option value="customer">Customer</option>
                <option value="admin">Admin</option>
                <option value="restaurant">Restaurant</option>
                <option value="deliveryPerson">Delivery Person</option>
            </select>
        </div>
        <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Login">
        </div>
        <div class="toggle-link">
            Don't have an account? <a href="register">Register</a>
        </div>
    </form>
</div>

<!-- Include the footer -->
<div th:replace="fragments/footer :: footer"></div>

<script>
    document.getElementById("login-form").addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent default form submission

        // Get selected role and form values
        const role = document.getElementById("login-role").value;
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        // Define login data structure based on role
        let loginData = { password: password }; // Base structure

        // Set role-specific email and field names
        if (role === "customer") {
            loginData = { role:role,customerEmail: email, password: password };
        } else if (role === "admin") {
            loginData = {  role:role, adminEmail: email, password: password };
        } else if (role === "restaurant") {
            loginData = {  role:role, restaurantEmail: email, password: password };
        } else if (role === "deliveryPerson") {
            loginData = {  role:role, deliveryPersonEmail: email, password: password };
        }

        // Send the data to the backend
        fetch("http://localhost:8080/api/v1/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(loginData)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Login failed");
            }
            return response.json();
        })
        .then(data => {
            alert("Login successful!");
            // Redirect user or perform actions based on role
            console.log(data);
        })
        .catch(error => {
            alert("Error: " + error.message);
            console.error("Login error:", error);
        });
    });
</script>


</body>
</html>
