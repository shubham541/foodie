<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/> <!-- Link to CSS file -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 30px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            color: #ff6347;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input[type="text"], .form-group input[type="password"],
        .form-group input[type="email"], .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .form-group input[type="submit"] {
            background-color: #ff6347;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }

        .form-group input[type="submit"]:hover {
            background-color: #ff7f50;
        }

        .toggle-link {
            text-align: center;
            margin-top: 10px;
        }

        .toggle-link a {
            color: #ff6347;
            text-decoration: none;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .extra-fields {
            display: none;
        }
    </style>
</head>
<body>

<!-- Include the header (navigation bar) -->
<div th:replace="fragments/header :: div"></div>

<div class="form-container">
    <h2>Register</h2>
    <form id="register-form">
        <div class="form-group">
            <label for="register-role">Register as:</label>
            <select id="register-role" name="role" onchange="showExtraFields()" required>
                <option value="customer">Customer</option>
                <option value="admin">Admin</option>
                <option value="restaurant">Restaurant</option>
                <option value="deliveryPerson">Delivery Person</option>
            </select>
        </div>

        <div class="form-group">
            <label for="register-name">Name</label>
            <input type="text" id="register-name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" placeholder="Enter your password" required>
        </div>

        <!-- Extra Fields for Delivery Person -->
        <div id="delivery-fields" class="extra-fields">
            <h4>Additional Details for Delivery Person</h4>
            <div class="form-group">
                <label for="contact-number">Contact Number</label>
                <input type="text" id="contact-number" name="contactNumber" placeholder="Enter contact number">
            </div>
            <div class="form-group">
                <label for="vehicle-type">Vehicle Type</label>
                <input type="text" id="vehicle-type" name="vehicleType" placeholder="Enter vehicle type">
            </div>
        </div>

        <!-- Extra Fields for Restaurant -->
        <div id="restaurant-fields" class="extra-fields">
            <h4>Additional Details for Restaurant</h4>
            <div class="form-group">
                <label for="restaurant-address">Address</label>
                <input type="text" id="restaurant-address" name="restaurantAddress"
                       placeholder="Enter restaurant address">
            </div>
            <div class="form-group">
                <label for="cuisine-type">Cuisine Type</label>
                <input type="text" id="cuisine-type" name="cuisineType" placeholder="Enter cuisine type">
            </div>
            <div class="form-group">
                <label for="pure-veg">Pure Veg (Yes/No)</label>
                <select id="pure-veg" name="pureVeg">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="opening-hours">Opening Hours</label>
                <input type="text" id="opening-hours" name="openingHours" placeholder="Enter opening hours">
            </div>
            <div class="form-group">
                <label for="closing-hours">Closing Hours</label>
                <input type="text" id="closing-hours" name="closingHours" placeholder="Enter closing hours">
            </div>
            <div class="form-group">
                <label for="delivery-zone">Delivery Zone</label>
                <input type="text" id="delivery-zone" name="deliveryZone" placeholder="Enter delivery zone">
            </div>
        </div>

        <div class="form-group">
            <input type="submit" value="Register">
        </div>
        <div class="toggle-link">
            Already have an account? <a href="login">Login</a>
        </div>
    </form>
</div>

<script>
    function showExtraFields() {
      var role = document.getElementById('register-role').value;
      document.getElementById('delivery-fields').style.display = role === 'deliveryPerson' ? 'block' : 'none';
      document.getElementById('restaurant-fields').style.display = role === 'restaurant' ? 'block' : 'none';
    }

    document.getElementById('register-form').addEventListener('submit', async function(event) {
      event.preventDefault();

      // Create the formData object with common fields based on role
      const role = document.getElementById('register-role').value;
      const formData = {
        password: document.getElementById('register-password').value
      };

      // Set name and email based on role
      formData.role=role;
      if (role === 'customer') {
        formData.customerEmail = document.getElementById('register-email').value;
        formData.customerName = document.getElementById('register-name').value;
      } else if (role === 'admin') {
        formData.adminEmail = document.getElementById('register-email').value;
        formData.adminName = document.getElementById('register-name').value;
      } else if (role === 'deliveryPerson') {
        formData.devEmail = document.getElementById('register-email').value;
        formData.devName = document.getElementById('register-name').value;
        formData.contactNumber = document.getElementById('contact-number').value;
        formData.vehicleType = document.getElementById('vehicle-type').value;
      } else if (role === 'restaurant') {
        formData.restaurantEmail = document.getElementById('register-email').value;
        formData.restaurantName = document.getElementById('register-name').value;
        formData.restaurantAddress = document.getElementById('restaurant-address').value;
        formData.cuisineType = document.getElementById('cuisine-type').value;
        formData.pureVeg = document.getElementById('pure-veg').value;
        formData.openingHours = document.getElementById('opening-hours').value;
        formData.closingHours = document.getElementById('closing-hours').value;
        formData.deliveryZone = document.getElementById('delivery-zone').value;
      }

      try {
        const response = await fetch('http://localhost:8080/api/v1/customer/save', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          alert('Registration successful!');
        } else {
          alert('Registration failed!');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred while registering.');
      }
    });
</script>

<!-- Include the footer -->
<div th:replace="fragments/footer :: footer"></div>


</body>
</html>
