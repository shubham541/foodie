<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Order food online')}"></head>
<body>
<div th:replace="~{layout/base :: header}"></div>

<main>
    <section class="hero" id="hero" aria-live="polite">
        <img class="bg" th:src="@{/images/brand/hero.jpg}" alt="">
        <div class="inner">
            <img class="logo" th:src="@{/images/brand/logo.jpg}" alt="">
            <div class="grow">
                <h1 id="r-name">House of Shukita</h1>
                <div class="muted" id="r-desc"></div>
                <div class="row wrap mt" style="margin-top:10px">
                    <span class="status-pill" id="r-status"><i></i><span>Loading&hellip;</span></span>
                    <span class="status-pill" id="r-cuisine"></span>
                    <span class="status-pill" id="r-tax"></span>
                </div>
            </div>
        </div>
    </section>
    <div class="notice hidden" id="closed-notice">We are not taking orders right now. You can still browse the menu.</div>

    <div class="menu-tools">
        <div class="row wrap">
            <input class="grow" id="search" type="search" placeholder="Search dishes (e.g. paneer, maggi, egg)" aria-label="Search menu" style="min-width:220px">
            <label class="switch" style="margin:0"><input type="checkbox" id="veg-only"> Veg only</label>
        </div>
        <div class="chips" id="chips" role="tablist" aria-label="Menu categories"></div>
    </div>

    <div id="menu"><div class="loader">Loading menu&hellip;</div></div>
</main>

<!-- Cart drawer -->
<div class="overlay hidden" id="overlay"></div>
<aside class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-label="Your cart">
    <header><h2 style="margin:0">Your cart</h2><button class="btn ghost small" id="drawer-close" type="button" aria-label="Close cart">Close</button></header>
    <div class="content" id="drawer-body"></div>
    <footer id="drawer-foot"></footer>
</aside>

<div th:replace="~{layout/base :: footer}"></div>
<script th:src="@{/js/store.js}" defer></script>
</body>
</html>
