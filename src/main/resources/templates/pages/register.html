<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Sign up')}"></head>
<body>
<div th:replace="~{layout/base :: header}"></div>
<main>
    <div class="card auth-card">
        <h1>Create your account</h1>
        <form id="register-form" novalidate>
            <label for="name">Full name</label>
            <input id="name" name="name" autocomplete="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="phone">Mobile number</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <div class="muted" style="font-size:.82rem;margin-top:4px">At least 8 characters, with a letter and a number.</div>
            <button class="btn block mt" type="submit" id="submit">Sign up</button>
        </form>
        <p class="muted mt">Already registered? <a th:href="@{/login}">Log in</a></p>
    </div>
</main>
<div th:replace="~{layout/base :: footer}"></div>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
