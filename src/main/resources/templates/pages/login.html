<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Log in')}"></head>
<body>
<div th:replace="~{layout/base :: header}"></div>
<main>
    <div class="card auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to order and track your pickup.</p>
        <div class="notice hidden" id="expired">Your session expired. Please log in again.</div>
        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn block mt" type="submit" id="submit">Log in</button>
        </form>
        <p class="muted mt">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
<div th:replace="~{layout/base :: footer}"></div>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
