spring.application.name=foodie
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# ---- Database (override with environment variables) ----
# Database name differs from the pre-1.0 prototype ("foodie") so its old schema is never touched.
spring.datasource.url=${FOODIE_DB_URL:jdbc:mysql://localhost:3306/shukita_foodie?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${FOODIE_DB_USER:root}
spring.datasource.password=${FOODIE_DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${FOODIE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Web / templates ----
spring.thymeleaf.cache=${FOODIE_TEMPLATE_CACHE:true}
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Application settings ----
# JWT: provide FOODIE_JWT_SECRET (min 32 chars) in any real deployment.
foodie.jwt.secret=${FOODIE_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
foodie.jwt.expiry-minutes=${FOODIE_JWT_EXPIRY_MINUTES:480}

foodie.order.max-quantity-per-item=20

# Seeded accounts. A blank password disables creating that account.
foodie.seed.enabled=true
foodie.seed.restaurant-email=${FOODIE_RESTAURANT_EMAIL:houseofshukita@gmail.com}
foodie.seed.restaurant-password=${FOODIE_RESTAURANT_PASSWORD:Shukita@12345}

# Brute-force protection for login
foodie.security.max-failed-logins=5
foodie.security.lockout-minutes=15
