# Production profile: secrets MUST come from the environment (the app refuses to start otherwise).
spring.thymeleaf.cache=true
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
foodie.production=true
# Behind the Caddy reverse proxy: trust X-Forwarded-* so scheme/client IP are correct.
server.forward-headers-strategy=framework
# Hosted database only: no localhost fallback. The app fails to start with a clear error if these are unset.
spring.datasource.url=${FOODIE_DB_URL}
spring.datasource.username=${FOODIE_DB_USER}
spring.datasource.password=${FOODIE_DB_PASSWORD}
